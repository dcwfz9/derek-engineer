    <text x="314.0" y="448" font-size="40" text-anchor="middle">🔍</text>
    <text x="314.0" y="498" font-size="46" font-weight="800" fill="#2a78d6"
          text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">1</text>
    <text x="314.0" y="526" font-size="18" font-weight="700" fill="#0b0b0b"
          text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">mystery solved</text>
    <foreignObject x="193.0" y="536" width="242.0" height="56">
