baseURL = "https://derek.engineer/"
languageCode = "en-us"
title = "derek.engineer"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  author = "Derek Welty"
  description = "Build notes by Derek Welty, an electrical engineer who builds things at home with an AI coding agent and tests them on the real hardware: RF, TVs, Raspberry Pis and home automation."
  keywords = ["home assistant", "raspberry pi", "electronics", "home lab", "python", "hugo", "embedded", "DIY", "derek welty"]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  env = "production"
  images = ["/og-default.png"]

  [params.homeInfoParams]
    Title = "Hi, I'm Derek"
    Content = "Electrical engineer. I direct an AI agent that writes most of my code, and I put the real hardware in the loop. These are the notes: what I measured, what failed, the command lines, and the details I'll need again."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/dcwfz9"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
