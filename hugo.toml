# www, not the bare name: Netlify serves www as the primary domain and 301s derek.engineer to it
# (its docs recommend www when DNS is outside Netlify). Canonical links, the sitemap and the feed follow this.
baseURL = "https://www.derek.engineer/"
languageCode = "en-us"
title = "derek.engineer"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  author = "Derek Welty"
  description = "My notebook: build notes by Derek Welty, an electrical engineer who builds things at home with an AI coding agent and tests them on the real hardware: RF, TVs, Raspberry Pis and home automation."
  keywords = ["home assistant", "raspberry pi", "electronics", "home lab", "python", "hugo", "embedded", "DIY", "derek welty"]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  env = "production"
  images = ["/og-default.png"]

  [params.homeInfoParams]
    Title = "Hi, I'm Derek"
    Content = "Electrical engineer on a mission to automate my life, and I over-engineer it along the way. I direct an AI agent that writes most of my code, and I put the real hardware in the loop. This is my notebook: what I measured, what failed, the command lines, and the details I'll need to come back to later. There have been a lot of posts lately because I've been Claude maxxing."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/dcwfz9"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:derek@derekwelty.com"
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.footer]
    text = "[RSS feed](/index.xml)"

[menu]
  # Five items so the menu fits one line on a phone; Search is last and shows as a magnifier (custom.css).
  # The archive, series, tags and RSS are linked from the last line of /map/ (RSS also from the footer and the home page icons).
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "map"
    name = "Map"
    url = "/map/"
    weight = 15
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 30
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 20
  [[menu.main]]
    identifier = "how-i-work"
    name = "How I work"
    url = "/how-i-work/"
    weight = 21
