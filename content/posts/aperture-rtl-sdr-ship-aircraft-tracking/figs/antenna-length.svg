<svg viewBox="0 0 1200 568" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#52514e"/></marker>
    <marker id="arrs" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#52514e"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="568" rx="16" fill="#fcfcfb" stroke="#e6e5e1" stroke-width="1.5"/>
  <text x="40" y="46" font-size="26" font-weight="800" fill="#0b0b0b">Same antenna, four lengths, four completely different jobs</text>
  <line x1="407.5" y1="120" x2="492.5" y2="120" stroke="#eb6834" stroke-width="7" stroke-linecap="round"/><circle cx="450" cy="120" r="6" fill="#0b0b0b"/><line x1="407.5" y1="106" x2="407.5" y2="134" stroke="#898781" stroke-width="1.5"/><line x1="492.5" y1="106" x2="492.5" y2="134" stroke="#898781" stroke-width="1.5"/><text x="391.5" y="126" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="end">2.5 in/ear</text><text x="514.5" y="116" font-size="19" font-weight="700" fill="#0b0b0b">915 MHz ISM</text><text x="514.5" y="140" font-size="15" fill="#52514e">utility meters, kit's shortest setting</text><line x1="353.1" y1="212" x2="546.9" y2="212" stroke="#2a78d6" stroke-width="7" stroke-linecap="round"/><circle cx="450" cy="212" r="6" fill="#0b0b0b"/><line x1="353.1" y1="198" x2="353.1" y2="226" stroke="#898781" stroke-width="1.5"/><line x1="546.9" y1="198" x2="546.9" y2="226" stroke="#898781" stroke-width="1.5"/><text x="337.1" y="218" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="end">5.7 in/ear</text><text x="568.9" y="208" font-size="19" font-weight="700" fill="#0b0b0b">433.92 MHz</text><text x="568.9" y="232" font-size="15" fill="#52514e">the neighborhood's weather sensors</text><line x1="297.0" y1="304" x2="603.0" y2="304" stroke="#898781" stroke-width="7" stroke-linecap="round"/><circle cx="450" cy="304" r="6" fill="#0b0b0b"/><line x1="297.0" y1="290" x2="297.0" y2="318" stroke="#898781" stroke-width="1.5"/><line x1="603.0" y1="290" x2="603.0" y2="318" stroke="#898781" stroke-width="1.5"/><text x="281.0" y="310" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="end">9 in/ear</text><text x="625.0" y="300" font-size="19" font-weight="700" fill="#0b0b0b">— (no assigned band)</text><text x="625.0" y="324" font-size="15" fill="#52514e">current setting, a compromise</text><line x1="178.0" y1="396" x2="722.0" y2="396" stroke="#1baf7a" stroke-width="7" stroke-linecap="round"/><circle cx="450" cy="396" r="6" fill="#0b0b0b"/><line x1="178.0" y1="382" x2="178.0" y2="410" stroke="#898781" stroke-width="1.5"/><line x1="722.0" y1="382" x2="722.0" y2="410" stroke="#898781" stroke-width="1.5"/><text x="162.0" y="402" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="end">16 in/ear</text><text x="744.0" y="392" font-size="19" font-weight="700" fill="#0b0b0b">162 MHz marine AIS</text><text x="744.0" y="416" font-size="15" fill="#52514e">ship tracking</text><line x1="178.0" y1="451" x2="722.0" y2="451" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arrs)"/><text x="178.0" y="475" font-size="16" fill="#52514e" text-anchor="start">longer element → lower frequency</text><text x="722.0" y="475" font-size="16" fill="#52514e" text-anchor="end">shorter element → higher frequency</text>
</svg>