    <text x="886.0" y="526" font-size="18" font-weight="700" fill="#0b0b0b"
          text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">cost of the dongle</text>
    <foreignObject x="765.0" y="536" width="242.0" height="56">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font: 13px system-ui, -apple-system, sans-serif; color:#52514e; text-align:center; line-height:1.35;">secondhand, off Craigslist</div>
    </foreignObject>
