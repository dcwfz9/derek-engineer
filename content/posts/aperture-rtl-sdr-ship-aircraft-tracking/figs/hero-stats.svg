    <text x="743.0" y="258" font-size="46" font-weight="800" fill="#2a78d6"
          text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">3</text>
    <text x="743.0" y="286" font-size="18" font-weight="700" fill="#0b0b0b"
          text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">weather sensors</text>
    <foreignObject x="622.0" y="296" width="242.0" height="56">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font: 13px system-ui, -apple-system, sans-serif; color:#52514e; text-align:center; line-height:1.35;">next door, decoded from their own radio bursts</div>
    </foreignObject>
  </g>
  <g>
    <rect x="898.0" y="150" width="262.0" height="210" rx="14"
          fill="#ffffff" stroke="#e6e5e1" stroke-width="1.5"/>
    <text x="1029.0" y="208" font-size="40" text-anchor="middle">📻</text>
    <text x="1029.0" y="258" font-size="46" font-weight="800" fill="#2a78d6"
          text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">18</text>
    <text x="1029.0" y="286" font-size="18" font-weight="700" fill="#0b0b0b"
          text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">AM stations found</text>
    <foreignObject x="908.0" y="296" width="242.0" height="56">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font: 13px system-ui, -apple-system, sans-serif; color:#52514e; text-align:center; line-height:1.35;">just by listening for their carriers</div>
    </foreignObject>
  </g>
  <g>
    <rect x="183.0" y="390" width="262.0" height="210" rx="14"
