<svg viewBox="0 0 1200 488" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#52514e"/></marker>
    <marker id="arrs" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#52514e"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="488" rx="16" fill="#fcfcfb" stroke="#e6e5e1" stroke-width="1.5"/>
  <text x="40" y="46" font-size="26" font-weight="800" fill="#0b0b0b">One antenna, three element lengths</text>
  <text x="40" y="76" font-size="16" fill="#52514e">Lengths are per ear and drawn to scale.</text>
  <!-- legend: darker shade = inside the base, row color = exposed telescoping element -->
  <rect x="740" y="27.5" width="10" height="10" rx="2" fill="#9b3500"/><rect x="753" y="27.5" width="10" height="10" rx="2" fill="#003f81"/><rect x="766" y="27.5" width="10" height="10" rx="2" fill="#036c49"/><text x="788" y="38" font-size="16" fill="#52514e">inside the base (~0.79 in / 2 cm per ear)</text>
  <rect x="740" y="51.5" width="10" height="10" rx="2" fill="#eb6834"/><rect x="753" y="51.5" width="10" height="10" rx="2" fill="#2a78d6"/><rect x="766" y="51.5" width="10" height="10" rx="2" fill="#1baf7a"/><text x="788" y="62" font-size="16" fill="#52514e">exposed telescoping element</text>
  <!-- 2.5 in exposed + 0.79 in base = 3.29 in per ear -->
  <rect x="464.07" y="142.5" width="111.86" height="7" rx="3.5" fill="#eb6834"/><rect x="506.57" y="139.5" width="26.86" height="13" rx="2.5" fill="#9b3500"/><circle cx="520" cy="146" r="4" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="1.5"/><line x1="464.07" y1="132" x2="464.07" y2="160" stroke="#898781" stroke-width="1.5"/><line x1="575.93" y1="132" x2="575.93" y2="160" stroke="#898781" stroke-width="1.5"/>
  <text x="448.07" y="142" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="end">2.5 in exposed</text><text x="448.07" y="166" font-size="16" fill="#52514e" text-anchor="end">3.29 in with base</text>
  <text x="597.93" y="142" font-size="20" font-weight="700" fill="#0b0b0b">915 MHz ISM band</text><text x="597.93" y="166" font-size="16" fill="#52514e">resonates ~854 MHz (kit's shortest setting)</text>
  <!-- 5.5 in exposed + 0.79 in base = 6.29 in per ear -->
  <rect x="413.07" y="234.5" width="213.86" height="7" rx="3.5" fill="#2a78d6"/><rect x="506.57" y="231.5" width="26.86" height="13" rx="2.5" fill="#003f81"/><circle cx="520" cy="238" r="4" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="1.5"/><line x1="413.07" y1="224" x2="413.07" y2="252" stroke="#898781" stroke-width="1.5"/><line x1="626.93" y1="224" x2="626.93" y2="252" stroke="#898781" stroke-width="1.5"/>
  <text x="397.07" y="234" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="end">5.5 in exposed</text><text x="397.07" y="258" font-size="16" fill="#52514e" text-anchor="end">6.29 in with base</text>
  <text x="648.93" y="234" font-size="20" font-weight="700" fill="#0b0b0b">433.92 MHz weather sensors</text><text x="648.93" y="258" font-size="16" fill="#52514e">resonates ~446 MHz</text>
  <!-- 16 in exposed + 0.79 in base = 16.79 in per ear -->
  <rect x="234.57" y="326.5" width="570.86" height="7" rx="3.5" fill="#1baf7a"/><rect x="506.57" y="323.5" width="26.86" height="13" rx="2.5" fill="#036c49"/><circle cx="520" cy="330" r="4" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="1.5"/><line x1="234.57" y1="316" x2="234.57" y2="344" stroke="#898781" stroke-width="1.5"/><line x1="805.43" y1="316" x2="805.43" y2="344" stroke="#898781" stroke-width="1.5"/>
  <text x="218.57" y="326" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="end">16 in exposed</text><text x="218.57" y="350" font-size="16" fill="#52514e" text-anchor="end">16.79 in with base</text>
  <text x="827.43" y="326" font-size="20" font-weight="700" fill="#0b0b0b">162 MHz AIS ship tracking</text><text x="827.43" y="350" font-size="16" fill="#52514e">resonates ~167 MHz</text>
  <line x1="200" y1="388" x2="840" y2="388" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arrs)"/><text x="200" y="414" font-size="16" fill="#52514e" text-anchor="start">longer element → lower frequency</text><text x="840" y="414" font-size="16" fill="#52514e" text-anchor="end">shorter element → higher frequency</text>
  <text x="40" y="454" font-size="16" fill="#52514e">Resonance is estimated as 2808 / (exposed length + 0.79 in) MHz, the quarter-wave rule of thumb.</text>
</svg>
