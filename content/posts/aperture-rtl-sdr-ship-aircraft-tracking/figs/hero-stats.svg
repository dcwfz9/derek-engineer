    <text x="457.0" y="258" font-size="46" font-weight="800" fill="#2a78d6"
          text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">39</text>
    <text x="457.0" y="286" font-size="18" font-weight="700" fill="#0b0b0b"
          text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">aircraft tracked</text>
    <foreignObject x="336.0" y="296" width="242.0" height="56">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font: 13px system-ui, -apple-system, sans-serif; color:#52514e; text-align:center; line-height:1.35;">verified by tail number and registered owner</div>
    </foreignObject>
  </g>
  <g>
    <rect x="612.0" y="150" width="262.0" height="210" rx="14"
          fill="#ffffff" stroke="#e6e5e1" stroke-width="1.5"/>
