<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect x="0" y="0" width="1200" height="640" rx="16" fill="#fcfcfb" stroke="#e6e5e1" stroke-width="1.5"/>
  <text x="40" y="58" font-size="30" font-weight="800" fill="#0b0b0b">One $25 dongle, one antenna, a few months of evenings</text>
  <text x="40" y="86" font-size="16" fill="#52514e">everything below is a real, independently-checked count - not a demo</text>
  
  <g>
    <rect x="40.0" y="150" width="262.0" height="210" rx="14"
          fill="#ffffff" stroke="#e6e5e1" stroke-width="1.5"/>
    <text x="171.0" y="208" font-size="40" text-anchor="middle">🚢</text>
    <text x="171.0" y="258" font-size="46" font-weight="800" fill="#2a78d6"
          text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">61</text>
    <text x="171.0" y="286" font-size="18" font-weight="700" fill="#0b0b0b"
          text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">ships tracked</text>
    <foreignObject x="50.0" y="296" width="242.0" height="56">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font: 13px system-ui, -apple-system, sans-serif; color:#52514e; text-align:center; line-height:1.35;">IMO numbers checked against public registries</div>
    </foreignObject>
  </g>
  <g>
    <rect x="326.0" y="150" width="262.0" height="210" rx="14"
          fill="#ffffff" stroke="#e6e5e1" stroke-width="1.5"/>
